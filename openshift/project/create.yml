---
- name: Deploy a project with parameters on OpenShift
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Create OpenShift project
      kubernetes.core.k8s:
        kind: Project
        api_version: project.openshift.io/v1
        name: "{{ project_name }}"
        state: present
        definition:
          metadata:
            name: "{{ project_name }}"
            annotations:
              openshift.io/display-name: "{{ project_display_name }}"
              openshift.io/description: "{{ project_description }}"

    - name: Apply resource quotas to the project
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: "{{ resource_quota_name }}"
            namespace: "{{ project_name }}"
          spec:
            hard:
              requests.cpu: "{{ resource_quota_requests_cpu }}"
              requests.memory: "{{ resource_quota_requests_memory }}"
              limits.cpu: "{{ resource_quota_limits_cpu }}"
              limits.memory: "{{ resource_quota_limits_memory }}"

    - name: Apply default container limits
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: LimitRange
          metadata:
            name: "{{ container_limits_name }}"
            namespace: "{{ project_name }}"
          spec:
            limits:
              - type: Container
                default:
                  cpu: "{{ container_limits_default_cpu }}"
                  memory: "{{ container_limits_default_memory }}"
                defaultRequest:
                  cpu: "{{ container_limits_request_cpu }}"
                  memory: "{{ container_limits_request_memory }}"
